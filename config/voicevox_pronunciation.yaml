# config/voicevox_pronunciation.yaml
#
# VOICEVOX「剣崎雌雄」向けの単語単位の発音・アクセント調整用の設定ファイル。
# 人間の試聴・GUIでの確認で確定した項目のみ登録する。
# 未確認の単語の値を勝手に登録しないこと。
#
# 2つの方式:
# 1) method: text_replacement
#    「surface」表記を「to」に置き換えてから audio_query に渡す。
#    VOICEVOX は文脈条件を持てないため、同じ表記でも文脈によって
#    読みが異なる可能性がある場合は、該当segment単位で適用を制御する。
# 2) method: accent_phrases
#    audio_query のアクセント句を「accent_phrases」の構成に組み替え、
#    /mora_length・/mora_pitch で再計算する（VOICEVOX GUIの
#    アクセント編集と同じ処理）。
pronunciations:
  - surface: "開けます"
    method: text_replacement
    to: "ひらけます"
    scope: "episodes/001（本編）の「開けます」表記すべて"
    note: >-
      2026-08-30 人間指定。画面・ページを「開く」意では「ひらけます」と読む。
      制約: VOICEVOXには文脈条件がないため、将来「ドアを開けます」等で
      「あけます」と読むべき文脈が出た場合は、該当segmentだけ
      text_replacementを適用せず個別生成で対応する。
  - surface: "セキュリティ"
    method: text_replacement
    to: "セキュリティー"
    scope: "標準辞書（全Episodeの「セキュリティ」表記）"
    status: approved
    human_approved: true
    global: true
    provenance: "Episode001 + Episode015 Human review"
    date: "2026-09-08"
    note: >-
      2026-08-30 Episode001で人間指定。2026-09-08 Episode015 Human Gate 2で
      標準辞書への昇格を承認。表示字幕・公式UIは「セキュリティ」のまま、
      VOICEVOX入力は「セキュリティー」に統一する。
  - surface: "セキュリティ キー"
    method: text_replacement
    to: "セキュリティーキー"
    scope: "標準辞書（全Episodeの「セキュリティ キー」表記）"
    status: approved
    human_approved: true
    global: true
    provenance: "Episode015 Human Gate 2"
    date: "2026-09-08"
    note: >-
      表示字幕・公式UIは「セキュリティ キー」のまま、VOICEVOX入力は
      「セキュリティーキー」として一続きにする。語中の息継ぎ・pauseを
      入れない。アクセント位置はVOICEVOX標準を維持し、genericな
      「セキュリティ」より複合語を優先する。
  - surface: "バックアップ コード"
    method: text_replacement
    to: "バックアップコード"
    scope: "標準辞書（全Episodeの「バックアップ コード」表記）"
    status: approved
    human_approved: true
    global: true
    provenance: "Episode015 Human Gate 2"
    date: "2026-09-08"
    note: >-
      表示字幕・公式UIは「バックアップ コード」のまま、VOICEVOX入力は
      「バックアップコード」として一続きにする。語中の息継ぎ・pauseを
      入れない。アクセント位置は新設せず、VOICEVOX標準を維持する。
  - surface: "Gmail"
    method: text_replacement
    to: "ジーメール"
    scope: "episodes/001（本編）の「Gmail」表記すべて"
    note: "2026-08-30 人間指定。グメイル→ジーメール。"
