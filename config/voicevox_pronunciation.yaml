      人間承認エントリ。なお episode 002 の本編に「開きます」表記は存在せず、
      同種の「開くと」「開かなく」「開く・開いて」は VOICEVOX 標準で
      すでに「ひらく」系の読みになっていることを確認済み（再生成対象外）。
