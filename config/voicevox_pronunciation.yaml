      1アクセント句「アップストア」、モーラ ア・ッ・プ・ス・ト・ア、
      アクセント位置5。ア低→ッ以降で高く、トがアクセント核、
      最後のアで下がる形。
  - surface: "信用"
    method: accent_phrases
    reading: "シンヨオ"
    accent_phrases:
      - kana: "シンヨオ"
        accent: 2
    pitch_shape: low_high_plateau
    pitch_high_anchor_mora: 2
    pitch_low_delta: -0.45
    pitch_equalize_following_same_mora: true
    scope: "標準辞書（Episode008 human review）"
    note: >-
      2026-09-05 Episode 008 human review・添付VOICEVOX手動調整で承認。
      旧accent指定だけの設定を置き換え、VOICEVOXの長音表記（シンヨオ）に
      「シ」は低く、2モーラ目の「ン」で上げ、その後は高い位置を完全に
      維持する low_high_plateau を適用する。連続する「オ」「オ」は同じ
      pitchにそろえ、pitch差を作らない。pitch_low_delta=-0.45は文脈ごとの
      audio_queryで得た2モーラ目を高い基準にする相対値で、今後のEpisodeでも再利用する。
  - surface: "開きます"
    method: text_replacement
