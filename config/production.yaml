video:
  width: 1920
  height: 1080
  fps: 30
  video_codec: libx264
  crf: 20
  preset: medium
  audio_codec: aac
  audio_bitrate: 192k

scene_render:
  width: 1920
  height: 1080
  subtitle_safe_height: 180
  gpt_image_default_fit: full_bleed
  gpt_image_aspect_fallback: crop
  gpt_image_last_resort: cover_blur
  default_animation: static
  allowed_animation_exceptions:
    - very_slow_zoom
    - slow_zoom
    - crossfade
    - slow_pan
  horizontal_pan_requires_reason: true

production_metrics:
  path: work/production_metrics.json
  human_correction_count_manual: true

captions:
  max_chars_per_caption: 28
  min_seconds: 1.2
  max_seconds: 5.0

thumbnail:
  width: 1280
  height: 720
  font_size_main: 116
  badge: "公式確認"

tts:
  model_env: OPENAI_TTS_MODEL
  voice_env: OPENAI_TTS_VOICE
  default_model: gpt-4o-mini-tts
  default_voice: coral
  max_chars_per_chunk: 1200

# 標準ナレーター（001で確定）。OpenAI TTS はフォールバック/比較用として残す。
voicevox:
  engine_url: "http://127.0.0.1:50021"
  speaker_name: "剣崎雌雄"
  style_name: "ノーマル"
  speed_scale: 1.00
  intonation_scale: 1.00
  pitch_scale: 0.00
  per_sentence: true
  segments_under: "audio/voicevox_kenzaki/segments/"
  pronunciation_config: "config/voicevox_pronunciation.yaml"
  credit: "ナレーション：VOICEVOX:剣崎雌雄"
